<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W-Checker</title>
    <link rel="icon" href="data:,">
    <script>
        // Terapkan tema tersimpan sebelum halaman digambar (hindari kedipan).
        try {
            const savedTheme = localStorage.getItem('wchecker.theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) { /* abaikan */ }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 7.1 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>
            </div>
            <div>
                <h1>W-Checker</h1>
                <p data-i18n="app.subtitle"></p>
            </div>
            <div class="topbar-actions">
                <div class="seg seg-compact" role="group" data-i18n-aria="lang.label">
                    <button type="button" class="lang-btn" data-lang="id">ID</button>
                    <button type="button" class="lang-btn" data-lang="en">EN</button>
                </div>
                <button type="button" id="themeBtn" class="icon-btn"></button>
            </div>
        </header>

        <section class="panel">
            <div class="form-grid">
                <div>
                    <span class="field-label" data-i18n="loc.label"></span>
                    <div class="loc-grid">
                        <div class="loc-inputs">
                            <div class="search">
                                <label class="field-label sub" for="placeSearch" data-i18n="loc.search"></label>
                                <input type="text" id="placeSearch" autocomplete="off" spellcheck="false"
                                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="placeResults"
                                       data-i18n-placeholder="loc.searchPlaceholder">
                                <ul id="placeResults" class="search-results" role="listbox" hidden></ul>
                            </div>
                            <div class="row-2">
                                <div>
                                    <label class="field-label sub" for="latInput">Latitude</label>
                                    <input type="number" id="latInput" data-i18n-placeholder="loc.latPlaceholder" step="0.00001">
                                </div>
                                <div>
                                    <label class="field-label sub" for="lonInput">Longitude</label>
                                    <input type="number" id="lonInput" data-i18n-placeholder="loc.lonPlaceholder" step="0.00001">
                                </div>
                            </div>
                            <p class="loc-status" id="locStatus"></p>
                        </div>
                        <div>
                        <div class="map-wrap">
                            <div id="map" class="map"></div>
                            <div class="seg seg-compact map-layers" id="mapLayers" role="group" hidden>
                                <button type="button" class="map-layer-btn active" data-layer="street" data-i18n="map.layerStreet"></button>
                                <button type="button" class="map-layer-btn" data-layer="topo" data-i18n="map.layerTopo"></button>
                            </div>
                        </div>
                        <p class="hint map-status" id="mapStatus"></p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="range-grid">
                        <div>
                            <label class="field-label" for="dateFromInput" data-i18n="range.start"></label>
                            <div class="range-group">
                                <input type="date" id="dateFromInput" required>
                                <input type="time" id="timeFromInput" data-i18n-aria="range.startTime" value="06:00" step="3600" required>
                            </div>
                        </div>
                        <div>
                            <label class="field-label" for="dateToInput" data-i18n="range.end"></label>
                            <div class="range-group">
                                <input type="date" id="dateToInput" required>
                                <input type="time" id="timeToInput" data-i18n-aria="range.endTime" value="18:00" step="3600" required>
                            </div>
                        </div>
                    </div>
                    <p class="hint" id="rangeHint"></p>
                </div>

                <div class="form-footer">
                    <div>
                        <span class="field-label" data-i18n="agg.label"></span>
                        <div class="seg" id="interval-options">
                            <input type="radio" id="interval-hour" name="interval" value="hour" checked>
                            <label for="interval-hour" data-i18n="agg.hour"></label>
                            <input type="radio" id="interval-day" name="interval" value="day">
                            <label for="interval-day" data-i18n="agg.day"></label>
                            <input type="radio" id="interval-week" name="interval" value="week">
                            <label for="interval-week" data-i18n="agg.week"></label>
                            <input type="radio" id="interval-month" name="interval" value="month">
                            <label for="interval-month" data-i18n="agg.month"></label>
                        </div>
                    </div>
                    <button type="button" id="submitBtn" class="btn-primary">
                        <span class="spinner" id="submitSpinner" hidden></span>
                        <span id="submitLabel"></span>
                    </button>
                </div>
            </div>
        </section>

        <div id="error" class="error" role="alert" style="display: none;"></div>

        <div id="empty-state" class="empty" data-i18n-html="empty"></div>

        <section id="results" class="results" style="display: none;">
            <div id="location-info-container" class="panel"></div>

            <div class="toolbar">
                <div class="seg" role="tablist">
                    <button type="button" class="view-btn active" data-view="card" data-i18n="view.cards"></button>
                    <button type="button" class="view-btn" data-view="table" data-i18n="view.table"></button>
                </div>
                <div class="toolbar-right">
                    <p id="filter-info"></p>
                    <div class="decimal-group" data-i18n-title="decimal.title">
                        <span data-i18n="decimal.label"></span>
                        <div class="seg">
                            <input type="radio" id="decimal-dot" name="decimal" value=".">
                            <label for="decimal-dot">1.5</label>
                            <input type="radio" id="decimal-comma" name="decimal" value=",">
                            <label for="decimal-comma">1,5</label>
                        </div>
                    </div>
                    <button type="button" id="copyBtn" class="btn-secondary" data-i18n-title="copy.title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                        <span id="copyLabel"></span>
                    </button>
                </div>
            </div>

            <div id="card-content" class="view-panel active">
                <div id="card-grid" class="card-grid"></div>
            </div>
            <div id="table-content" class="view-panel"></div>
        </section>

        <p class="footnote" data-i18n="footnote"></p>
    </div>

</body>
</html>
