<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W-Checker</title>
    <link rel="icon" href="data:,">
    <script>
        // Terapkan tema tersimpan sebelum halaman digambar (hindari kedipan).
        try {
            const savedTheme = localStorage.getItem('wchecker.theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) { /* abaikan */ }
    </script>
    <style>
        :root {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --surface-2: #f8f9fb;
            --border: #e2e5ea;
            --border-strong: #cdd2da;
            --text: #14171c;
            --text-2: #454d5a;
            --text-3: #6b7380;
            --accent: #1f5fbf;
            --accent-hover: #194f9f;
            --accent-soft: #e8f0fc;
            --on-accent: #ffffff;
            --danger: #b42318;
            --danger-soft: #fdecea;
            --rain: #1f6fd1;
            --sun: #b86e00;
            --storm: #6941c6;
            --cloud: #6b7380;
            --radius: 8px;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg: #0f1115;
            --surface: #171a20;
            --surface-2: #1c2027;
            --border: #2a2f38;
            --border-strong: #3a414d;
            --text: #e7e9ee;
            --text-2: #b6bcc7;
            --text-3: #8a919d;
            --accent: #5b9cf5;
            --accent-hover: #7aaff7;
            --accent-soft: #1b2940;
            --on-accent: #0b0f16;
            --danger: #f97066;
            --danger-soft: #3a1d1b;
            --rain: #6aa8f7;
            --sun: #f0b143;
            --storm: #a48afb;
            --cloud: #9aa1ad;
            color-scheme: dark;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1115;
                --surface: #171a20;
                --surface-2: #1c2027;
                --border: #2a2f38;
                --border-strong: #3a414d;
                --text: #e7e9ee;
                --text-2: #b6bcc7;
                --text-3: #8a919d;
                --accent: #5b9cf5;
                --accent-hover: #7aaff7;
                --accent-soft: #1b2940;
                --on-accent: #0b0f16;
                --danger: #f97066;
                --danger-soft: #3a1d1b;
                --rain: #6aa8f7;
                --sun: #f0b143;
                --storm: #a48afb;
                --cloud: #9aa1ad;
                color-scheme: dark;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        /* ---------- Header ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--accent);
            color: var(--on-accent);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .brand-mark svg { width: 22px; height: 22px; }
        .topbar h1 { font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }
        .topbar p { color: var(--text-3); font-size: 0.875rem; }
        .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            color: var(--text-2);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            cursor: pointer;
        }
        .icon-btn:hover { color: var(--text); background: var(--surface-2); }
        .icon-btn svg { width: 16px; height: 16px; }

        /* ---------- Panels ---------- */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .field-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
        }
        .hint { font-size: 0.8125rem; color: var(--text-3); margin-top: 6px; }

        input[type="text"], input[type="number"], input[type="date"], input[type="time"] {
            width: 100%;
            min-width: 0;
            height: 40px;
            padding: 0 12px;
            font: inherit;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-variant-numeric: tabular-nums;
        }
        input::placeholder { color: var(--text-3); }
        input:focus-visible, button:focus-visible, .seg input:focus-visible + label {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        input:focus { border-color: var(--accent); }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .range-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .range-group { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
        .form-grid > *, .row-2 > *, .range-grid > *, .range-group > *, .summary > * { min-width: 0; }

        /* ---------- Lokasi: cari + koordinat + peta dalam satu panel ---------- */
        .loc-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
            gap: 16px;
            align-items: start;
        }
        .loc-inputs { display: grid; gap: 12px; }
        .field-label.sub { font-weight: 500; color: var(--text-3); margin-bottom: 4px; }
        .loc-status { font-size: 0.8125rem; color: var(--text-3); }
        .loc-status strong { font-weight: 600; color: var(--text); }

        .search { position: relative; }
        .search-results {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 20;
            list-style: none;
            max-height: 290px;
            overflow: auto;
            padding: 4px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        }
        .search-results[hidden] { display: none; }
        .search-item { padding: 7px 10px; border-radius: 4px; cursor: pointer; }
        .search-item .name { display: block; font-size: 0.875rem; font-weight: 600; }
        .search-item .detail { display: block; font-size: 0.75rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
        .search-item[aria-selected="true"], .search-item:hover { background: var(--accent-soft); }
        .search-empty { padding: 8px 10px; font-size: 0.8125rem; color: var(--text-3); }

        /* ---------- Peta ---------- */
        .map {
            height: 280px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--surface-2);
            isolation: isolate;
            overflow: hidden;
        }
        .map-wrap { position: relative; }
        .map-layers {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            background: var(--surface);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        .map-layers[hidden] { display: none; }
        .map .maplibregl-ctrl-attrib { font-size: 11px; }
        .map-status.error { color: var(--danger); }

        /* ---------- Segmented controls ---------- */
        .seg {
            display: inline-flex;
            flex-wrap: wrap;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 2px;
            gap: 2px;
        }
        .seg button, .seg label {
            font: inherit;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-2);
            background: transparent;
            border: 0;
            border-radius: 5px;
            padding: 5px 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .seg button:hover, .seg label:hover { color: var(--text); }
        .seg button.active, .seg input:checked + label {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 0 0 1px var(--border-strong);
        }
        .seg input { position: absolute; opacity: 0; pointer-events: none; }
        .seg-compact button { padding: 3px 9px; font-size: 0.75rem; font-weight: 600; }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            min-width: 150px;
            padding: 0 20px;
            font: inherit;
            font-weight: 600;
            color: var(--on-accent);
            background: var(--accent);
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.7; cursor: progress; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner[hidden] { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Messages ---------- */
        .error {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 0.875rem;
        }
        .empty {
            margin-top: 16px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-3);
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
            font-size: 0.875rem;
        }

        /* ---------- Summary ---------- */
        .results { margin-top: 16px; }
        .summary {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }
        .summary h2 { font-size: 1.125rem; font-weight: 650; }
        .summary .meta { color: var(--text-2); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            white-space: nowrap;
        }
        .notes { margin-top: 12px; display: grid; gap: 4px; }
        .notes p { font-size: 0.8125rem; color: var(--text-3); }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1px;
            margin-top: 16px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .stat { background: var(--surface); padding: 12px 14px; }
        .stat-label { font-size: 0.75rem; color: var(--text-3); }
        .stat-value {
            font-size: 1.375rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .stat-value small { font-size: 0.8125rem; font-weight: 500; color: var(--text-3); margin-left: 3px; }
        .stat-sub { font-size: 0.75rem; color: var(--text-3); font-variant-numeric: tabular-nums; }

        /* ---------- Toolbar ---------- */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 12px;
        }
        .toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        #filter-info { font-size: 0.8125rem; color: var(--text-3); }
        .decimal-group { display: flex; align-items: center; gap: 6px; }
        .decimal-group > span { font-size: 0.8125rem; color: var(--text-3); }
        .decimal-group .seg label { padding: 3px 10px; font-variant-numeric: tabular-nums; }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            font: inherit;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-secondary svg { width: 14px; height: 14px; }
        .btn-secondary.done { color: var(--accent); border-color: var(--accent); }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* ---------- Cards ---------- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 10px;
        }
        .day-heading {
            grid-column: 1 / -1;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-2);
            padding: 10px 0 2px;
            border-bottom: 1px solid var(--border);
        }
        .day-heading:first-child { padding-top: 0; }
        .grid-note { grid-column: 1 / -1; font-size: 0.8125rem; color: var(--text-3); }

        .wcard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }
        .wcard-head { display: flex; justify-content: space-between; gap: 8px; }
        .wcard-title { font-weight: 650; font-variant-numeric: tabular-nums; }
        .wcard-sub { font-size: 0.8125rem; color: var(--text-3); }
        .wcard-temp {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 8px 0 10px;
            font-variant-numeric: tabular-nums;
        }
        .wcard-temp small { font-size: 0.875rem; font-weight: 500; color: var(--text-3); margin-left: 2px; }
        .wcard-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .wcard-stats dt { font-size: 0.75rem; color: var(--text-3); }
        .wcard-stats dd { font-size: 0.875rem; font-weight: 500; font-variant-numeric: tabular-nums; }

        .wet { color: var(--rain); font-weight: 600; }

        .wicon { width: 32px; height: 32px; flex-shrink: 0; }
        .wicon svg { width: 100%; height: 100%; }
        .wicon-sun, .wicon-partly { color: var(--sun); }
        .wicon-cloud, .wicon-fog, .wicon-unknown { color: var(--cloud); }
        .wicon-rain, .wicon-snow { color: var(--rain); }
        .wicon-storm { color: var(--storm); }

        /* ---------- Table ---------- */
        .table-wrap {
            overflow: auto;
            max-height: 70vh;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .weather-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8125rem;
            font-variant-numeric: tabular-nums;
        }
        .weather-table th, .weather-table td {
            padding: 8px 12px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }
        .weather-table th {
            position: sticky;
            top: 0;
            background: var(--surface-2);
            color: var(--text-2);
            font-weight: 600;
            z-index: 1;
        }
        .weather-table .num { text-align: right; }
        .weather-table tbody tr:hover td { background: var(--surface-2); }
        .weather-table tbody tr:last-child td { border-bottom: 0; }

        .footnote { margin-top: 24px; font-size: 0.75rem; color: var(--text-3); }

        @media (max-width: 720px) {
            .container { padding-top: 16px; }
            .panel { padding: 16px; }
            .range-grid { grid-template-columns: 1fr; }
            .form-footer { align-items: stretch; }
            .form-footer > div { width: 100%; }
            .form-footer .seg { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
            .form-footer .seg label { padding: 5px 4px; text-align: center; }
            .btn-primary { width: 100%; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .loc-grid { grid-template-columns: 1fr; }
            .map { height: 240px; }
        }
        @media (max-width: 480px) {
            .topbar p { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 7.1 3.5 3.5 0 0 0 7 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>
            </div>
            <div>
                <h1>W-Checker</h1>
                <p data-i18n="app.subtitle"></p>
            </div>
            <div class="topbar-actions">
                <div class="seg seg-compact" role="group" data-i18n-aria="lang.label">
                    <button type="button" class="lang-btn" data-lang="id" onclick="setLanguage('id')">ID</button>
                    <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                </div>
                <button type="button" id="themeBtn" class="icon-btn" onclick="toggleTheme()"></button>
            </div>
        </header>

        <section class="panel">
            <div class="form-grid">
                <div>
                    <span class="field-label" data-i18n="loc.label"></span>
                    <div class="loc-grid">
                        <div class="loc-inputs">
                            <div class="search">
                                <label class="field-label sub" for="placeSearch" data-i18n="loc.search"></label>
                                <input type="text" id="placeSearch" autocomplete="off" spellcheck="false"
                                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="placeResults"
                                       data-i18n-placeholder="loc.searchPlaceholder">
                                <ul id="placeResults" class="search-results" role="listbox" hidden></ul>
                            </div>
                            <div class="row-2">
                                <div>
                                    <label class="field-label sub" for="latInput">Latitude</label>
                                    <input type="number" id="latInput" data-i18n-placeholder="loc.latPlaceholder" step="0.00001">
                                </div>
                                <div>
                                    <label class="field-label sub" for="lonInput">Longitude</label>
                                    <input type="number" id="lonInput" data-i18n-placeholder="loc.lonPlaceholder" step="0.00001">
                                </div>
                            </div>
                            <p class="loc-status" id="locStatus"></p>
                        </div>
                        <div>
                        <div class="map-wrap">
                            <div id="map" class="map"></div>
                            <div class="seg seg-compact map-layers" id="mapLayers" role="group" hidden>
                                <button type="button" class="map-layer-btn active" data-layer="street" onclick="setMapLayer('street')" data-i18n="map.layerStreet"></button>
                                <button type="button" class="map-layer-btn" data-layer="topo" onclick="setMapLayer('topo')" data-i18n="map.layerTopo"></button>
                            </div>
                        </div>
                        <p class="hint map-status" id="mapStatus"></p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="range-grid">
                        <div>
                            <label class="field-label" for="dateFromInput" data-i18n="range.start"></label>
                            <div class="range-group">
                                <input type="date" id="dateFromInput" required>
                                <input type="time" id="timeFromInput" data-i18n-aria="range.startTime" value="06:00" step="3600" required>
                            </div>
                        </div>
                        <div>
                            <label class="field-label" for="dateToInput" data-i18n="range.end"></label>
                            <div class="range-group">
                                <input type="date" id="dateToInput" required>
                                <input type="time" id="timeToInput" data-i18n-aria="range.endTime" value="18:00" step="3600" required>
                            </div>
                        </div>
                    </div>
                    <p class="hint" id="rangeHint"></p>
                </div>

                <div class="form-footer">
                    <div>
                        <span class="field-label" data-i18n="agg.label"></span>
                        <div class="seg" id="interval-options">
                            <input type="radio" id="interval-hour" name="interval" value="hour" checked>
                            <label for="interval-hour" data-i18n="agg.hour"></label>
                            <input type="radio" id="interval-day" name="interval" value="day">
                            <label for="interval-day" data-i18n="agg.day"></label>
                            <input type="radio" id="interval-week" name="interval" value="week">
                            <label for="interval-week" data-i18n="agg.week"></label>
                            <input type="radio" id="interval-month" name="interval" value="month">
                            <label for="interval-month" data-i18n="agg.month"></label>
                        </div>
                    </div>
                    <button type="button" id="submitBtn" class="btn-primary" onclick="getWeather()">
                        <span class="spinner" id="submitSpinner" hidden></span>
                        <span id="submitLabel"></span>
                    </button>
                </div>
            </div>
        </section>

        <div id="error" class="error" role="alert" style="display: none;"></div>

        <div id="empty-state" class="empty" data-i18n-html="empty"></div>

        <section id="results" class="results" style="display: none;">
            <div id="location-info-container" class="panel"></div>

            <div class="toolbar">
                <div class="seg" role="tablist">
                    <button type="button" class="view-btn active" data-view="card" onclick="switchResultTab('card')" data-i18n="view.cards"></button>
                    <button type="button" class="view-btn" data-view="table" onclick="switchResultTab('table')" data-i18n="view.table"></button>
                </div>
                <div class="toolbar-right">
                    <p id="filter-info"></p>
                    <div class="decimal-group" data-i18n-title="decimal.title">
                        <span data-i18n="decimal.label"></span>
                        <div class="seg">
                            <input type="radio" id="decimal-dot" name="decimal" value=".">
                            <label for="decimal-dot">1.5</label>

                96: 'Badai Petir dengan Hujan Es', 99: 'Badai Petir Parah'
            },
            en: {
                0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
                45: 'Fog', 48: 'Dense Fog', 51: 'Light Drizzle', 53: 'Drizzle', 55: 'Heavy Drizzle',
                61: 'Light Rain', 63: 'Moderate Rain', 65: 'Heavy Rain', 71: 'Light Snow', 73: 'Snow',
                75: 'Heavy Snow', 77: 'Snow Grains', 80: 'Light Showers', 81: 'Moderate Showers', 82: 'Heavy Showers',

        const LOCALES = { id: 'id-ID', en: 'en-GB' };

        // ================== PREFERENSI (disimpan per browser) ==================
        const PREF = { lang: 'wchecker.lang', theme: 'wchecker.theme', decimal: 'wchecker.decimalSeparator', lastLocation: 'wchecker.lastLocation' };
        const readPref = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
        const writePref = (key, value) => { try { localStorage.setItem(key, value); } catch (e) { /* abaikan */ } };

        let lang = readPref(PREF.lang) === 'en' ? 'en' : 'id';
        let decimalSep = readPref(PREF.decimal) === ',' ? ',' : '.';

        const locale = () => LOCALES[lang];
        function t(key, params = {}) {
            const s = STRINGS[lang][key] ?? STRINGS.id[key] ?? key;
            return s.replace(/\{(\w+)\}/g, (_, k) => (params[k] ?? ''));
        }

        // ================== KONFIGURASI API ==================
        // Batas Forecast API (dicek ke API langsung: ~92 hari ke belakang s/d 15 hari ke depan).
        const FORECAST_PAST_DAYS = 92;
        const FORECAST_DAYS_AHEAD = 15;
        const ARCHIVE_MIN_DATE = '1940-01-01';
        const MAX_CARDS = 500; // batas jumlah kartu agar browser tidak berat untuk rentang panjang

        const API = {
            archive: {
                url: 'https://archive-api.open-meteo.com/v1/archive',
                label: 'Historical API',
                // Archive tidak punya precipitation_probability (selalu null), jadi tidak diminta.
                hourly: 'temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m'
            },
            forecast: {
                url: 'https://api.open-meteo.com/v1/forecast',
                label: 'Forecast API',
                hourly: 'temperature_2m,relative_humidity_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m'
            }
        };

        // Lokasi = koordinat di latInput/lonInput (satu-satunya sumber kebenaran).
        // selectedPlace hanya label nama tempat, dan dihapus begitu titik digeser lewat peta/input manual.
        let selectedPlace = null; // { name, lat, lon }
        const DEFAULT_LOCATION = { name: 'Makassar, Sulawesi Selatan, Indonesia', lat: -5.14861, lon: 119.43194 };
        let currentResultTab = 'card';
        let globalRawWeatherData = null;
        let isLoading = false;

        // ================== HELPER TANGGAL & ANGKA ==================
        // Pakai tanggal LOKAL (bukan toISOString yang UTC -> salah hari sebelum jam 08:00 WITA).
        const pad = n => String(n).padStart(2, '0');
        const toISODate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        function addDays(isoDate, n) {
            const d = new Date(`${isoDate}T00:00:00`);
            d.setDate(d.getDate() + n);
            return toISODate(d);
        }
        const fmtDateShort = iso => new Date(`${iso}T00:00:00`).toLocaleDateString(locale(), { day: '2-digit', month: 'short', year: 'numeric' });

        function getLimits() {
            const today = toISODate(new Date());
            return {
                today,
                yesterday: addDays(today, -1),
                forecastMin: addDays(today, -FORECAST_PAST_DAYS),
                forecastMax: addDays(today, FORECAST_DAYS_AHEAD)
            };
        }

        // Semua angka yang tampil/tersalin lewat fmt() agar mengikuti pilihan pemisah desimal.
        const fmt = (v, digits) => {
            if (v === null || v === undefined || Number.isNaN(v)) return '-';
            const s = v.toFixed(digits);
            return decimalSep === ',' ? s.replace('.', ',') : s;
        };
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const $ = id => document.getElementById(id);

        // ================== BAHASA, TEMA, DESIMAL ==================
        function applyLanguage() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));

            $('rangeHint').textContent = t('range.hint', { date: fmtDateShort(getLimits().forecastMax) });
            $('submitLabel').textContent = t(isLoading ? 'btn.loading' : 'btn.check');
            $('copyLabel').textContent = t('copy.label');
            updateThemeButton();
            updateMapStatus();
            updateLocStatus();
            closeSearchResults();
            if (globalRawWeatherData) displayWeather(globalRawWeatherData);
        }

        function setLanguage(newLang) {
            if (newLang === lang) return;
            lang = newLang;
            writePref(PREF.lang, lang);
            applyLanguage();
        }

        function currentTheme() {
            const attr = document.documentElement.getAttribute('data-theme');
            if (attr === 'light' || attr === 'dark') return attr;
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function toggleTheme() {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            writePref(PREF.theme, next);
            updateThemeButton();
        }

        const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
        const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

        function updateThemeButton() {
            const dark = currentTheme() === 'dark';
            const btn = $('themeBtn');
            btn.innerHTML = dark ? ICON_SUN : ICON_MOON;
            const label = t(dark ? 'theme.toLight' : 'theme.toDark');
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        function setDecimalSeparator(sep) {
            decimalSep = sep;
            writePref(PREF.decimal, sep);
            if (globalRawWeatherData) displayWeather(globalRawWeatherData);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const { today, forecastMax } = getLimits();
            $('dateFromInput').value = today;
            $('dateToInput').value = today;
            ['dateFromInput', 'dateToInput'].forEach(id => {
                $(id).setAttribute('min', ARCHIVE_MIN_DATE);
                $(id).setAttribute('max', forecastMax);
            });

            document.querySelectorAll('input[name="interval"]').forEach(radio => {
                radio.addEventListener('change', updateDisplayedResults);
            });

            $(decimalSep === ',' ? 'decimal-comma' : 'decimal-dot').checked = true;
            document.querySelectorAll('input[name="decimal"]').forEach(radio => {
                radio.addEventListener('change', () => setDecimalSeparator(radio.value));
            });

            // Koordinat yang diketik manual ikut menggeser penanda di peta.
            ['latInput', 'lonInput'].forEach(id => $(id).addEventListener('change', onCoordsTyped));
            setupPlaceSearch();

            // Isi awal: lokasi terakhir yang dicek (kalau ada), selain itu Makassar.
            let initial = DEFAULT_LOCATION;
            try {
                const saved = JSON.parse(readPref(PREF.lastLocation) || 'null');
                if (saved && Number.isFinite(saved.lat) && Number.isFinite(saved.lon)) initial = saved;
            } catch (e) { /* abaikan data rusak */ }
            setLocation(initial.lat, initial.lon, initial.name ? initial : null);

            // Tema "ikuti perangkat" ikut berubah kalau setelan perangkat berubah.
            if (window.matchMedia) {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                if (mq.addEventListener) mq.addEventListener('change', updateThemeButton);
            }

            applyLanguage();
            initMap();
        });

        function switchResultTab(tab) {
            currentResultTab = tab;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.view === tab));
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.toggle('active', panel.id === `${tab}-content`));
        }

        // ================== PETA (MapLibre + OpenFreeMap, gratis tanpa API key) ==================
        // Server tile resmi OpenStreetMap (relawan) bisa memblokir aplikasi/jaringan sewaktu-waktu,
        // jadi peta dasar memakai OpenFreeMap: gratis, tanpa key, tanpa batas, boleh komersial,
        // dan mengizinkan akses dari file:// (CORS *). Tile-nya vektor, sehingga perlu MapLibre GL.
        // MapLibre baru dimuat saat tab Peta dibuka, supaya aplikasi tetap jalan walau CDN gagal.
        const MAPLIBRE_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/';
        const MAP_DEFAULT_VIEW = { center: [118, -2.5], zoom: 4 }; // Indonesia, urutan [lon, lat]
        const MAP_POINT_ZOOM = 10;
        const MAP_STYLES = {
            street: 'https://tiles.openfreemap.org/styles/liberty',
            topo: {
                version: 8,
                sources: {
                    topo: {
                        type: 'raster',
                        tiles: ['a', 'b', 'c'].map(s => `https://${s}.tile.opentopomap.org/{z}/{x}/{y}.png`),
                        tileSize: 256,
                        maxzoom: 17,
                        attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, SRTM | © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)'
                    }
                },
                layers: [{ id: 'topo', type: 'raster', source: 'topo' }]
            }
        };
        const MARKER_COLOR = '#e5484d';
        let map = null, mapMarker = null, currentMapLayer = 'street', mapTileError = false;
        let mapState = 'idle'; // idle | loading | ready | failed
        let mapLibPromise = null;

        function loadMapLibrary() {
            if (window.maplibregl) return Promise.resolve();
            if (!mapLibPromise) {
                const load = (tag, attrs) => new Promise((resolve, reject) => {
                    const el = Object.assign(document.createElement(tag), attrs);
                    el.onload = resolve;
                    el.onerror = reject;
                    document.head.appendChild(el);
                });
                mapLibPromise = Promise.all([
                    load('link', { rel: 'stylesheet', href: MAPLIBRE_BASE + 'maplibre-gl.css' }),
                    load('script', { src: MAPLIBRE_BASE + 'maplibre-gl.js' })
                ]).catch(err => { mapLibPromise = null; throw err; });
            }
            return mapLibPromise;
        }

        function readInputCoords() {
            const lat = parseFloat($('latInput').value);
            const lon = parseFloat($('lonInput').value);
            const valid = !isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180;
            return valid ? { lat, lon } : null;
        }

        async function initMap() {
            if (mapState === 'ready' || mapState === 'loading') return;

            mapState = 'loading';
            updateMapStatus();
            let coords;
            try {
                await loadMapLibrary();
                coords = readInputCoords(); // dibaca setelah library siap; lokasi bisa sudah berubah selama memuat
                // Konstruktor gagal kalau browser tidak mendukung WebGL.
                map = new maplibregl.Map({
                    container: 'map',
                    style: MAP_STYLES.street,
                    center: coords ? [coords.lon, coords.lat] : MAP_DEFAULT_VIEW.center,
                    zoom: coords ? MAP_POINT_ZOOM : MAP_DEFAULT_VIEW.zoom,
                    attributionControl: { compact: true }
                });
            } catch (e) {
                console.warn('Peta gagal dimuat:', e);
                mapState = 'failed';
                updateMapStatus();
                return;
            }

            map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
            map.on('click', e => setLocation(e.lngLat.lat, e.lngLat.lng, null));
            map.on('error', e => {
                // Error tile/sumber (mis. server tile menolak) -> beri tahu pengguna, peta tetap bisa diklik.
                console.warn('Error peta:', e.error || e);
                if (!mapTileError) { mapTileError = true; updateMapStatus(); }
            });
            if (coords) placeMarker(coords.lat, coords.lon);

            mapState = 'ready';
            $('mapLayers').hidden = false;
            updateMapStatus();
            setTimeout(() => map.resize(), 0);
        }

        function setMapLayer(name) {
            if (!map || name === currentMapLayer) return;
            currentMapLayer = name;
            mapTileError = false;
            map.setStyle(MAP_STYLES[name]); // penanda (Marker) tidak ikut terhapus saat ganti style
            document.querySelectorAll('.map-layer-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.layer === name));
            updateMapStatus();
        }

        function placeMarker(lat, lon) {
            if (!map) return; // peta belum/tidak termuat; initMap() akan membaca koordinat dari input
            if (!mapMarker) {
                mapMarker = new maplibregl.Marker({ color: MARKER_COLOR, draggable: true }).setLngLat([lon, lat]).addTo(map);
                mapMarker.on('dragend', () => {
                    const p = mapMarker.getLngLat();
                    setLocation(p.lat, p.lng, null);
                });
            } else {
                mapMarker.setLngLat([lon, lat]);
            }
        }

        function updateMapStatus() {
            const el = $('mapStatus');
            if (!el) return;
            el.classList.toggle('error', mapState === 'failed' || mapTileError);
            if (mapState === 'failed') { el.textContent = t('map.failed'); return; }
            if (mapState === 'loading') { el.textContent = t('map.loading'); return; }
            if (mapTileError) { el.textContent = t(currentMapLayer === 'topo' ? 'map.topoFailed' : 'map.tilesFailed'); return; }
            el.textContent = t('map.hint');
        }

        // ================== LOKASI (satu sumber: koordinat) ==================
        // Semua cara memilih lokasi (cari tempat, ketik koordinat, klik/geser peta) lewat sini.
        function setLocation(lat, lon, place, { fly = false } = {}) {
            lon = ((lon + 540) % 360) - 180; // normalisasi kalau peta digeser melewati garis 180°
            $('latInput').value = lat.toFixed(5);
            $('lonInput').value = lon.toFixed(5);
            selectedPlace = place ? { name: place.name, lat, lon } : null;
            // Nama di kotak cari hanya dipertahankan kalau memang titik itu yang dipilih dari pencarian.
            if (!place) $('placeSearch').value = '';
            placeMarker(lat, lon);
            if (fly && map) map.flyTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), MAP_POINT_ZOOM), essential: true });
            updateLocStatus();
        }

        function onCoordsTyped() {
            const coords = readInputCoords();
            if (coords) setLocation(coords.lat, coords.lon, null, { fly: true });
            else updateLocStatus();
        }

        function updateLocStatus() {
            const el = $('locStatus');
            if (!el) return;
            if (selectedPlace) el.innerHTML = t('loc.selectedPlace', { name: escapeHtml(selectedPlace.name) });
            else if (readInputCoords()) el.innerHTML = t('loc.selectedPoint');
            else el.textContent = t('loc.none');
        }

        // ================== CARI TEMPAT (Open-Meteo Geocoding) ==================
        const SEARCH_DEBOUNCE_MS = 350;
        const SEARCH_MIN_CHARS = 2;
        let searchTimer = null, searchSeq = 0, searchResults = [], activeResult = -1;

        const placeLabel = r => [...new Set([r.name, r.admin2, r.admin1, r.country].filter(Boolean))].join(', ');

        async function searchPlaces(query, count = 6) {
            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=${count}&language=${lang}&format=json`;
            const res = await fetch(url);
            const data = await res.json();
            return (data.results || []).map(r => ({
                name: placeLabel(r),
                shortName: r.name,
                region: [...new Set([r.admin2, r.admin1, r.country].filter(Boolean))].join(', '),
                lat: r.latitude,
                lon: r.longitude
            }));
        }

        function setupPlaceSearch() {
            const input = $('placeSearch');
            input.addEventListener('input', () => {
                clearTimeout(searchTimer);
                const q = input.value.trim();
                if (q.length < SEARCH_MIN_CHARS) { closeSearchResults(); return; }
                searchTimer = setTimeout(() => runSearch(q), SEARCH_DEBOUNCE_MS);
            });
            input.addEventListener('keydown', e => {
                const open = !$('placeResults').hidden && searchResults.length > 0;
                if (e.key === 'ArrowDown' && open) { e.preventDefault(); highlightResult(Math.min(activeResult + 1, searchResults.length - 1)); }
                else if (e.key === 'ArrowUp' && open) { e.preventDefault(); highlightResult(Math.max(activeResult - 1, 0)); }
                else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (open) chooseResult(activeResult >= 0 ? activeResult : 0);
                    else if (input.value.trim().length >= SEARCH_MIN_CHARS) { clearTimeout(searchTimer); runSearch(input.value.trim(), true); }
                }
                else if (e.key === 'Escape') closeSearchResults();
            });
            input.addEventListener('blur', () => setTimeout(closeSearchResults, 150));
            // mousedown (bukan click) supaya terpilih sebelum input kehilangan fokus
            $('placeResults').addEventListener('mousedown', e => {
                const item = e.target.closest('[data-index]');
                if (!item) return;
                e.preventDefault();
                chooseResult(Number(item.dataset.index));
            });
        }

        async function runSearch(query, pickFirst = false) {
            const seq = ++searchSeq;
            let results;
            try {
                results = await searchPlaces(query);
            } catch (e) {
                if (seq === searchSeq) renderSearchMessage(t('loc.searchFailed'));
                return;
            }
            if (seq !== searchSeq) return; // sudah ada pencarian yang lebih baru
            searchResults = results;
            activeResult = -1;
            if (!results.length) { renderSearchMessage(t('loc.searchNoResult')); return; }
            if (pickFirst) { chooseResult(0); return; }
            const list = $('placeResults');
            list.innerHTML = results.map((r, i) => `
                <li class="search-item" role="option" id="place-opt-${i}" data-index="${i}" aria-selected="false">
                    <span class="name">${escapeHtml(r.shortName)}</span>
                    <span class="detail">${escapeHtml(r.region)} · ${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</span>
                </li>`).join('');
            list.hidden = false;
            $('placeSearch').setAttribute('aria-expanded', 'true');
        }

        function renderSearchMessage(message) {
            searchResults = [];
            activeResult = -1;
            const list = $('placeResults');
            list.innerHTML = `<li class="search-empty" role="presentation">${escapeHtml(message)}</li>`;
            list.hidden = false;
            $('placeSearch').setAttribute('aria-expanded', 'true');
        }

        function highlightResult(index) {
            activeResult = index;
            document.querySelectorAll('#placeResults .search-item').forEach((el, i) => {
                el.setAttribute('aria-selected', String(i === index));
                if (i === index) el.scrollIntoView({ block: 'nearest' });
            });
            $('placeSearch').setAttribute('aria-activedescendant', index >= 0 ? `place-opt-${index}` : '');
        }

        function chooseResult(index) {
            const r = searchResults[index];
            if (!r) return;
            closeSearchResults();
            setLocation(r.lat, r.lon, r, { fly: true });
            $('placeSearch').value = r.shortName;
            selectedPlace.query = r.shortName; // penanda: teks di kotak cari = tempat yang terpilih
        }

        function closeSearchResults() {
            const list = $('placeResults');
            if (!list) return;
            list.hidden = true;
            list.innerHTML = '';
            activeResult = -1;
            $('placeSearch').setAttribute('aria-expanded', 'false');
            $('placeSearch').removeAttribute('aria-activedescendant');
        }

        // ================== IKON & DESKRIPSI CUACA ==================
        const CLOUD_HIGH = 'M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 7.1 3.5 3.5 0 0 0 7 14z';
        const ICON_PATHS = {
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
            partly: '<circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 2.5v1M3.6 4.1l.7.7M2.5 8.5h1M13.4 4.1l-.7.7"/><path fill="var(--surface)" d="M9.5 20h8a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 8.7 13.6 3.2 3.2 0 0 0 9.5 20z"/>',
            cloud: '<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18z"/>',
            fog: `<path d="${CLOUD_HIGH}"/><path d="M5 17.5h14M7 21h10"/>`,
            rain: `<path d="${CLOUD_HIGH}"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>`,
            storm: `<path d="${CLOUD_HIGH}"/><path d="M12.5 15l-2 3.5h3l-2 3.5"/>`,
            snow: `<path d="${CLOUD_HIGH}"/><path d="M8 18h.01M12 18h.01M16 18h.01M10 21h.01M14 21h.01"/>`,
            unknown: '<path d="M8 12h8"/>'
        };

        function weatherCategory(code) {
            if (code === null || code === undefined) return 'unknown';
            if (code === 0) return 'sun';
            if (code <= 2) return 'partly';
            if (code === 3) return 'cloud';
            if (code <= 48) return 'fog';
            if (code <= 67) return 'rain';
            if (code <= 77) return 'snow';
            if (code <= 82) return 'rain';
            if (code <= 86) return 'snow';
            if (code <= 99) return 'storm';
            return 'cloud';
        }

        function weatherIcon(code) {
            const cat = weatherCategory(code);
            return `<span class="wicon wicon-${cat}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[cat]}</svg></span>`;
        }

        function getWeatherDescription(code) {
            if (code === null || code === undefined) return t('desc.na');
            return WEATHER_DESC[lang][code] || t('desc.unknown');
        }

        // ================== ROUTING API ==================
        // Pecah rentang: sebelum hari ini -> archive, hari ini & ke depan -> forecast.
        function planSegments(dateFrom, dateTo, limits) {
            const segments = [];
            if (dateFrom <= limits.yesterday) {
                segments.push({ kind: 'archive', start: dateFrom, end: dateTo < limits.yesterday ? dateTo : limits.yesterday });
            }
            if (dateTo >= limits.today) {
                segments.push({ kind: 'forecast', start: dateFrom > limits.today ? dateFrom : limits.today, end: dateTo });
            }
            return segments;
        }

        async function fetchSegment(kind, start, end, lat, lon) {
            const api = API[kind];
            const url = `${api.url}?latitude=${lat}&longitude=${lon}&hourly=${api.hourly}&start_date=${start}&end_date=${end}&timezone=auto`;
            console.log(`[${api.label}] ${url}`);
            const res = await fetch(url);
            const data = await res.json();
            if (data.error || !data.hourly) {
                throw new Error(data.reason ? `${api.label}: ${data.reason}` : t('err.noData', { api: api.label }));
            }
            const h = data.hourly;
            const val = (arr, i) => (arr && arr[i] !== undefined) ? arr[i] : null;
            return h.time.map((time, i) => ({
                time, // waktu lokal lokasi (timezone=auto), format YYYY-MM-DDTHH:MM
                temp: val(h.temperature_2m, i),
                humidity: val(h.relative_humidity_2m, i),
                precip: val(h.precipitation, i),
                prob: val(h.precipitation_probability, i),
                code: val(h.weather_code, i),
                wind: val(h.wind_speed_10m, i),
                source: kind
            }));
        }

        const isEmptyRow = r => r.temp === null && r.code === null && r.precip === null;

        async function fetchAllRows(dateFrom, dateTo, lat, lon, limits) {
            const segments = planSegments(dateFrom, dateTo, limits);
            const results = await Promise.all(segments.map(s => fetchSegment(s.kind, s.start, s.end, lat, lon)));
            const rows = results.flat();

            // Arsip kadang belum terisi untuk beberapa hari terakhir -> isi dari Forecast API
            // (Forecast API masih menyimpan ~92 hari ke belakang).
            let backfilled = 0;
            const gaps = rows.filter(r => r.source === 'archive' && isEmptyRow(r) && r.time.slice(0, 10) >= limits.forecastMin);
            if (gaps.length > 0) {
                const gapStart = gaps[0].time.slice(0, 10);
                const gapEnd = gaps[gaps.length - 1].time.slice(0, 10);
                try {
                    const fill = new Map((await fetchSegment('forecast', gapStart, gapEnd, lat, lon)).map(r => [r.time, r]));
                    rows.forEach((r, i) => {
                        if (r.source === 'archive' && isEmptyRow(r) && fill.has(r.time)) {
                            rows[i] = fill.get(r.time);
                            backfilled++;
                        }
                    });
                } catch (e) {
                    console.warn('Gagal mengisi kekosongan arsip dari Forecast API:', e.message);
                }
            }

            return { rows, segments, backfilled };
        }

        function setLoading(loading) {
            isLoading = loading;
            $('submitBtn').disabled = loading;
            $('submitSpinner').hidden = !loading;
            $('submitLabel').textContent = t(loading ? 'btn.loading' : 'btn.check');
        }

        async function getWeather() {
            const dateFrom = $('dateFromInput').value;
            const timeFrom = $('timeFromInput').value;
            const dateTo = $('dateToInput').value;
            const timeTo = $('timeToInput').value;
            const limits = getLimits();

            try {
                // --- 1. Validasi ---
                if (!dateFrom || !timeFrom || !dateTo || !timeTo) throw new Error(t('err.incomplete'));
                const startDateTime = new Date(`${dateFrom}T${timeFrom}:00`);
                const endDateTime = new Date(`${dateTo}T${timeTo}:00`);
                if (startDateTime >= endDateTime) throw new Error(t('err.order'));
                if (dateTo > limits.forecastMax) {
                    throw new Error(t('err.forecastMax', { date: fmtDateShort(limits.forecastMax), days: FORECAST_DAYS_AHEAD }));
                }
                if (dateFrom < ARCHIVE_MIN_DATE) throw new Error(t('err.archiveMin', { date: fmtDateShort(ARCHIVE_MIN_DATE) }));

                // --- 2. Koordinat ---
                // Kebiasaan lama: ketik nama tempat lalu langsung tekan Cek Cuaca tanpa memilih dari daftar
                // -> pakai hasil pencarian pertama.
                const typed = $('placeSearch').value.trim();
                const typedButNotChosen = typed && !(selectedPlace && selectedPlace.query === typed);
                if (!typedButNotChosen && !readInputCoords()) {
                    const hasAnyInput = $('latInput').value !== '' || $('lonInput').value !== '';
                    throw new Error(t(hasAnyInput ? 'err.coordsInvalid' : 'err.locationMissing'));
                }

                setLoading(true);
                hideMessages();
                closeSearchResults();

                if (typedButNotChosen) {
                    searchSeq++; // batalkan hasil autocomplete yang mungkin masih dalam perjalanan
                    const [first] = await searchPlaces(typed, 1);
                    if (!first) throw new Error(t('err.cityNotFound', { q: typed }));
                    searchResults = [first];
                    chooseResult(0);
                }

                const { lat, lon } = readInputCoords();
                const placeName = selectedPlace ? selectedPlace.name : null;

                // --- 3. Ambil data (otomatis archive / forecast / gabungan) ---
                const { rows, segments, backfilled } = await fetchAllRows(dateFrom, dateTo, lat, lon, limits);

                globalRawWeatherData = { rows, segments, backfilled, startDateTime, endDateTime, placeName, lat, lon };
                writePref(PREF.lastLocation, JSON.stringify({ name: placeName, lat, lon }));
                displayWeather(globalRawWeatherData);
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        function hideMessages() {
            $('error').style.display = 'none';
            $('empty-state').style.display = 'none';
            $('results').style.display = 'none';
        }

        // ================== FILTER & AGREGASI ==================
        function filterRows(rawData) {
            const { rows, startDateTime, endDateTime } = rawData;
            return rows
                .map(r => ({ ...r, dateTime: new Date(r.time) }))
                .filter(r => r.dateTime >= startDateTime && r.dateTime <= endDateTime);
        }

        function periodKeyDate(dt, interval) {
            if (interval === 'day') return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
            if (interval === 'week') {
                const d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
                d.setDate(d.getDate() - (d.getDay() + 6) % 7); // mundur ke hari Senin
                return d;
            }
            return new Date(dt.getFullYear(), dt.getMonth(), 1); // month
        }

        function aggregateRows(rows, interval) {
            if (interval === 'hour') {
                return rows.map(r => ({
                    dateTime: r.dateTime, temp: r.temp, humidity: r.humidity, precipitation_mm: r.precip,
                    precipitation_prob: r.prob, weatherCode: r.code, windSpeed: r.wind, interval
                }));
            }

            const groups = new Map();
            rows.forEach(r => {
                const keyDate = periodKeyDate(r.dateTime, interval);
                const key = keyDate.getTime();
                if (!groups.has(key)) {
                    groups.set(key, { date: keyDate, temp: [], humidity: [], precip: [], prob: [], wind: [], codes: {} });
                }
                const g = groups.get(key);
                // Hanya nilai yang tidak null yang ikut dihitung
                ['temp', 'humidity', 'precip', 'prob', 'wind'].forEach(f => { if (r[f] !== null) g[f].push(r[f]); });
                if (r.code !== null) g.codes[r.code] = (g.codes[r.code] || 0) + 1;
            });

            const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
            const sum = arr => arr.length ? arr.reduce((a, b) => a + b, 0) : null;

            return Array.from(groups.values())
                .sort((a, b) => a.date - b.date)
                .map(g => {
                    let dominantCode = null, maxCount = 0;
                    for (const code in g.codes) {
                        if (g.codes[code] > maxCount) { maxCount = g.codes[code]; dominantCode = parseInt(code); }
                    }
                    return {
                        dateTime: g.date,
                        temp: avg(g.temp),
                        humidity: avg(g.humidity),
                        precipitation_mm: sum(g.precip),
                        precipitation_prob: avg(g.prob),
                        weatherCode: dominantCode,
                        windSpeed: avg(g.wind),
                        interval
                    };
                });
        }

        // ================== RINGKASAN RENTANG ==================
        // Dihitung dari data per jam pada rentang yang dipilih, tidak tergantung pilihan agregasi.
        const RAIN_HOUR_THRESHOLD = 0.1; // mm per jam, dianggap "jam hujan"

        function computeSummary(rows) {
            const withVal = f => rows.filter(r => r[f] !== null && r[f] !== undefined);
            const maxBy = (arr, f) => arr.reduce((m, r) => (!m || r[f] > m[f]) ? r : m, null);

            const precipRows = withVal('precip');
            const temps = withVal('temp').map(r => r.temp);
            const windRows = withVal('wind');

            return {
                totalRain: precipRows.length ? precipRows.reduce((a, r) => a + r.precip, 0) : null,
                wettest: maxBy(precipRows, 'precip'),
                rainHours: precipRows.filter(r => r.precip >= RAIN_HOUR_THRESHOLD).length,
                precipHours: precipRows.length,
                tempMin: temps.length ? temps.reduce((a, b) => Math.min(a, b)) : null,
                tempMax: temps.length ? temps.reduce((a, b) => Math.max(a, b)) : null,
                tempAvg: temps.length ? temps.reduce((a, b) => a + b, 0) / temps.length : null,
                windest: maxBy(windRows, 'wind'),
                windAvg: windRows.length ? windRows.reduce((a, r) => a + r.wind, 0) / windRows.length : null
            };
        }

        function renderSummaryStats(s) {
            const shortDT = d => d.toLocaleString(locale(), { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
            const tile = (label, value, sub) =>
                `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`;
            const withUnit = (v, digits, unit) => (v === null || v === undefined) ? '-' : `${fmt(v, digits)}<small>${unit}</small>`;

            const rainSub = s.totalRain === null ? t('stats.noData')
                : (s.wettest.precip > 0 ? t('stats.wettest', { v: fmt(s.wettest.precip, 2), t: shortDT(s.wettest.dateTime) }) : t('stats.noRain'));
            const tempValue = s.tempMin === null ? '-' : `${fmt(s.tempMin, 1)}–${fmt(s.tempMax, 1)}<small>°C</small>`;

            return `
                <div class="stats">
                    ${tile(t('stats.totalRain'), withUnit(s.totalRain, 2, 'mm'), rainSub)}
                    ${tile(t('stats.rainHours'), s.precipHours ? `${s.rainHours}<small>${t('stats.hoursOf', { n: s.precipHours })}</small>` : '-', t('stats.rainHoursSub', { v: fmt(RAIN_HOUR_THRESHOLD, 1) }))}
                    ${tile(t('stats.temp'), tempValue, s.tempAvg === null ? '-' : t('stats.tempAvg', { v: fmt(s.tempAvg, 1) }))}
                    ${tile(t('stats.wind'), withUnit(s.windest ? s.windest.wind : null, 1, 'km/h'),
                        s.windest ? t('stats.windSub', { t: shortDT(s.windest.dateTime), v: fmt(s.windAvg, 1) }) : '-')}
                </div>
            `;
        }

        // ================== SALIN TABEL ==================
        // Disalin sebagai TSV (teks) + tabel HTML, sehingga tempel ke Excel langsung jadi sel.
        async function copyTable() {
            const table = document.querySelector('#table-content table');
            if (!table) return;

            const cells = [...table.rows].map(tr => [...tr.cells].map(c => c.textContent.trim()));
            const tsv = cells.map(row => row.join('\t')).join('\n');
            const html = `<table>${cells.map(row => `<tr>${row.map(v => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</table>`;

            let ok = false;
            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({
                        'text/plain': new Blob([tsv], { type: 'text/plain' }),
                        'text/html': new Blob([html], { type: 'text/html' })
                    })]);
                    ok = true;
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(tsv);
                    ok = true;
                }
            } catch (e) {
                console.warn('Clipboard API gagal, pakai cara lama:', e);
            }
            if (!ok) {
                // Cadangan untuk browser lama / konteks yang tidak mengizinkan Clipboard API
                const ta = document.createElement('textarea');
                ta.value = tsv;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                ta.remove();
            }

            const btn = $('copyBtn');
            const label = $('copyLabel');
            label.textContent = ok ? t('copy.done', { n: cells.length - 1 }) : t('copy.failed');
            btn.classList.toggle('done', ok);
            clearTimeout(copyTable.timer);
            copyTable.timer = setTimeout(() => {
                label.textContent = t('copy.label');
                btn.classList.remove('done');
            }, 2500);
        }

        // ================== TAMPILAN ==================
        const fmtDateTime = d =>
            `${d.toLocaleDateString(locale(), { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' })} ${d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit', hour12: false })}`;

        function displayWeather(rawData) {
            const chips = rawData.segments.map(s =>
                `<span class="chip">${API[s.kind].label} · ${fmtDateShort(s.start)}${s.start !== s.end ? ' – ' + fmtDateShort(s.end) : ''}</span>`
            ).join('');

            const notes = [];
            if (rawData.segments.some(s => s.kind === 'archive')) notes.push(t('note.noProb'));
            if (rawData.backfilled > 0) notes.push(t('note.backfilled', { n: rawData.backfilled }));

            $('location-info-container').innerHTML = `
                <div class="summary">
                    <div>
                        <h2>${escapeHtml(rawData.placeName || t('loc.pointName'))}</h2>
                        <p class="meta">${rawData.lat.toFixed(5)}, ${rawData.lon.toFixed(5)}</p>
                        <p class="meta">${fmtDateTime(rawData.startDateTime)} – ${fmtDateTime(rawData.endDateTime)}</p>
                    </div>
                    <div class="chips">${chips}</div>
                </div>
                ${renderSummaryStats(computeSummary(filterRows(rawData)))}
                ${notes.length ? `<div class="notes">${notes.map(n => `<p>${n}</p>`).join('')}</div>` : ''}
            `;

            $('results').style.display = 'block';
            updateDisplayedResults();
        }

        function updateDisplayedResults() {
            if (!globalRawWeatherData) return;

            const selectedInterval = document.querySelector('input[name="interval"]:checked').value;
            const data = aggregateRows(filterRows(globalRawWeatherData), selectedInterval);

            if (data.length === 0) {
                $('card-grid').innerHTML = '';
                $('table-content').innerHTML = '';
                $('filter-info').textContent = t('info.none');
                return;
            }

            $('filter-info').textContent = t('info.rows', { label: t(`info.${selectedInterval}`), n: data.length });

            generateCardView(data);
            generateTableView(data);
        }

        function cardTitle(item) {
            const d = item.dateTime;
            const loc = locale();
            if (item.interval === 'hour') return d.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit', hour12: false });
            if (item.interval === 'day') return d.toLocaleDateString(loc, { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
            if (item.interval === 'week') {
                const end = new Date(d);
                end.setDate(d.getDate() + 6);
                return `${d.toLocaleDateString(loc, { day: '2-digit', month: 'short' })} – ${end.toLocaleDateString(loc, { day: '2-digit', month: 'short', year: 'numeric' })}`;
            }
            return d.toLocaleDateString(loc, { month: 'long', year: 'numeric' });
        }

        function generateCardView(data) {
            const shown = data.slice(0, MAX_CARDS);
            const isHourly = data[0].interval === 'hour';
            let html = '';
            let lastDay = '';

            if (data.length > MAX_CARDS) {
                html += `<p class="grid-note">${t('cards.limited', { max: MAX_CARDS, n: data.length })}</p>`;
            }

            shown.forEach(item => {
                if (isHourly) {
                    const day = item.dateTime.toLocaleDateString(locale(), { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
                    if (day !== lastDay) {
                        html += `<h3 class="day-heading">${day}</h3>`;
                        lastDay = day;
                    }
                }

                const wet = item.precipitation_mm !== null && item.precipitation_mm > 0 ? ' class="wet"' : '';
                const prob = item.precipitation_prob === null ? '-' : `${fmt(item.precipitation_prob, 0)}%`;

                html += `
                    <article class="wcard">
                        <div class="wcard-head">
                            <div>
                                <div class="wcard-title">${cardTitle(item)}</div>
                                <div class="wcard-sub">${getWeatherDescription(item.weatherCode)}</div>
                            </div>
                            ${weatherIcon(item.weatherCode)}
                        </div>
                        <div class="wcard-temp">${fmt(item.temp, 1)}<small>°C${isHourly ? '' : ' ' + t('card.avg')}</small></div>
                        <dl class="wcard-stats">
                            <div><dt>${t(isHourly ? 'card.rain' : 'card.rainTotal')}</dt><dd${wet}>${fmt(item.precipitation_mm, 2)} mm</dd></div>
                            <div><dt>${t('card.prob')}</dt><dd>${prob}</dd></div>
                            <div><dt>${t('card.humidity')}</dt><dd>${fmt(item.humidity, 0)}%</dd></div>
                            <div><dt>${t('card.wind')}</dt><dd>${fmt(item.windSpeed, 1)} km/h</dd></div>
                        </dl>
                    </article>
                `;
            });
            $('card-grid').innerHTML = html;
        }

        function generateTableView(data) {
            const loc = locale();
            const rowsHtml = data.map(item => {
                let period;
                if (item.interval === 'hour') {
                    period = item.dateTime.toLocaleString(loc, {
                        day: '2-digit', month: 'short', year: 'numeric',
                        hour: '2-digit', minute: '2-digit', hour12: false
                    });
                } else if (item.interval === 'day') {
                    period = item.dateTime.toLocaleDateString(loc, { day: '2-digit', month: 'long', year: 'numeric' });
                } else if (item.interval === 'week') {
                    const endOfWeek = new Date(item.dateTime);
                    endOfWeek.setDate(item.dateTime.getDate() + 6);
                    const opts = { day: '2-digit', month: 'short' };
                    period = t('table.week', { a: item.dateTime.toLocaleDateString(loc, opts), b: endOfWeek.toLocaleDateString(loc, opts) });
                } else {
                    period = item.dateTime.toLocaleDateString(loc, { month: 'long', year: 'numeric' });
                }
                const desc = item.weatherCode === null ? '-' : getWeatherDescription(item.weatherCode);
                const wet = item.precipitation_mm !== null && item.precipitation_mm > 0 ? ' wet' : '';
                return `<tr>
                        <td>${period}</td>
                        <td>${desc}</td>
                        <td class="num">${fmt(item.temp, 1)}</td>
                        <td class="num">${fmt(item.humidity, 0)}</td>
                        <td class="num${wet}">${fmt(item.precipitation_mm, 2)}</td>
                        <td class="num">${fmt(item.precipitation_prob, 0)}</td>
                        <td class="num">${fmt(item.windSpeed, 1)}</td>
                    </tr>`;
            }).join('');

            $('table-content').innerHTML = `
                <div class="table-wrap">
                    <table class="weather-table">
                        <thead>
                            <tr>
                                <th>${t('th.period')}</th>
                                <th>${t('th.weather')}</th>
                                <th class="num">${t('th.temp')}</th>
                                <th class="num">${t('th.humidity')}</th>
                                <th class="num">${t('th.precip')}</th>
                                <th class="num">${t('th.prob')}</th>
                                <th class="num">${t('th.wind')}</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
        }

        function showError(message) {
            $('error').textContent = message;
            $('error').style.display = 'block';
            $('results').style.display = 'none';
        }
    </script>
</body>
</html>
